<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络检测 · 字里行间</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#f2f4f2;--surface:#fff;--ink:#1d2622;--muted:#5d6a64;--line:#d9dfdb;--ok:#2e7d4f;--bad:#b3412e;--warn:#a36a12;--acc:#2e6b5e}
@media (prefers-color-scheme:dark){:root{--bg:#151a19;--surface:#1d2423;--ink:#e6ece9;--muted:#9aa7a1;--line:#2e3836;--ok:#6cc08c;--bad:#e58c79;--warn:#e0b05a;--acc:#7fc1b0}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "LXGW WenKai","Kaiti SC",serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 6px}
p{color:var(--muted);margin:6px 0 14px}
ul{list-style:none;padding:0;margin:16px 0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;border-bottom:1px solid var(--line)}
li small{grid-column:1/-1;color:var(--muted);font-size:13px}
.r{font-weight:700;white-space:nowrap}.ok{color:var(--ok)}.bad{color:var(--bad)}.slow{color:var(--warn)}
button{font:inherit;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer}
button.ghost{background:none;color:var(--acc)}
</style>
</head>
<body>
<main>
  <h1>网络检测</h1>
  <p>请在中国大陆的网络下打开这个页面（不开 VPN），等所有项目出结果后，点「复制结果」发给我。只检测能不能连上，不会收集任何信息。</p>
  <div><button id="run" type="button">重新检测</button> <button id="copy" class="ghost" type="button">复制结果</button></div>
  <ul id="list"></ul>
  <p id="meta"></p>
</main>
<script>
const T=[
  ["本站页面","./index.html","same","打开 app 本身"],
  ["本站字体","./fonts/wenkai/lxgwwenkai-regular-subset-100.woff2","same","霞鹜文楷字体文件"],
  ["每日文章","./marginalia/index.json","same","每天推送的阅读文章"],
  ["Wiktionary 查词","https://en.wiktionary.org/api/rest_v1/page/definition/Haus","cors","点单词查释义"],
  ["Supabase（邮箱登录候选）","https://supabase.co/","no-cors","邮箱登录和同步的服务商之一"],
  ["Cloudflare（邮箱登录候选）","https://www.cloudflare.com/cdn-cgi/trace","no-cors","另一种同步服务的候选"],
  ["GitHub API","https://api.github.com/zen","cors","GitHub 同步方式"],
  ["Anthropic API","https://api.anthropic.com/","no-cors","AI 功能（拍照识别、AI 补全）"],
  ["Google 字体","https://fonts.gstatic.com/","no-cors","仅作对比，app 已经不用了"]
];
const list=document.getElementById("list"); let results=[];
function row(i,name,note){ const li=document.createElement("li"); li.innerHTML=`<span>${name}</span><span class="r" id="r${i}">检测中…</span><small>${note}</small>`; list.appendChild(li); }
async function probe(url,mode){
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),10000), t0=performance.now();
  try{ const r=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{mode:mode==="same"?"same-origin":mode,cache:"no-store",signal:ac.signal});
    const ms=Math.round(performance.now()-t0); if(mode!=="no-cors"&&!r.ok&&r.status>=500) return {ok:false,ms,why:"HTTP "+r.status}; return {ok:true,ms}; }
  catch(e){ return {ok:false,ms:Math.round(performance.now()-t0),why:e.name==="AbortError"?"超时":"连不上"}; }
  finally{ clearTimeout(tm); }
}
async function run(){
  list.innerHTML=""; results=[]; T.forEach((t,i)=>row(i,t[0],t[3]));
  await Promise.all(T.map(async(t,i)=>{ const r=await probe(t[1],t[2]); results[i]=r;
    const el=document.getElementById("r"+i); el.className="r "+(r.ok?(r.ms>3000?"slow":"ok"):"bad");
    el.textContent=r.ok?(r.ms>3000?"慢 ":"✓ ")+(r.ms/1000).toFixed(1)+" 秒":"✗ "+r.why; }));
  document.getElementById("meta").textContent="检测时间："+new Date().toLocaleString("zh-CN")+" · "+navigator.userAgent.replace(/^Mozilla\/5\.0 /,"").slice(0,90);
}
document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{
  const txt=T.map((t,i)=>{ const r=results[i]; return t[0]+"："+(!r?"未完成":r.ok?"通 "+(r.ms/1000).toFixed(1)+"s":"不通（"+r.why+"）"); }).join("\n")+"\n"+document.getElementById("meta").textContent;
  try{ await navigator.clipboard.writeText(txt); document.getElementById("copy").textContent="已复制"; }catch(e){ prompt("复制下面的结果：",txt); }
};
run();
</script>
</body>
</html>
