name: wk-samples (dev helper)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s
          UA="Entrelinhas-dev/1.0 (github.com/Shentuyuxia/entrelinhas)"
          for w in maison; do
            curl -sL -A "$UA" "https://en.wiktionary.org/api/rest_v1/page/definition/$w?redirect=true" -o en-$w.json; sleep 3; done
          for w in schön; do
            curl -sL -A "$UA" "https://de.wiktionary.org/w/api.php?action=parse&page=$w&prop=text&format=json&formatversion=2&redirects=1" -o de-$w.json; sleep 3; done
          for w in falar; do
            curl -sL -A "$UA" "https://pt.wiktionary.org/w/api.php?action=parse&page=$w&prop=text&format=json&formatversion=2&redirects=1" -o pt-$w.json; sleep 3; done
          for w in maison aller beau; do
            curl -sL -A "$UA" "https://fr.wiktionary.org/w/api.php?action=parse&page=$w&prop=text&format=json&formatversion=2&redirects=1" -o fr-$w.json; sleep 3; done
          ls -la
      - run: |
          cd s && git init -q -b wk-samples && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm samples
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wk-samples
